<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161310" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="活树" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>活树</title>
  <meta name="description" content="吃掉信息流，长出一本个人正典" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button class="icon-btn tree-toggle" id="treeToggle" aria-label="知识树" type="button" title="知识树">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      </button>
      <a class="wordmark" href="#" id="logoHome">
        <svg class="tree-mark breathe" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <path d="M16 26 V12" stroke="#7cb87c" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          <path d="M16 20 L10 14" stroke="#7cb87c" stroke-width="1.4" stroke-linecap="round" fill="none"/>
          <path d="M16 17 L22 11" stroke="#7cb87c" stroke-width="1.4" stroke-linecap="round" fill="none"/>
          <path d="M16 14 L12 9" stroke="#6aa86a" stroke-width="1.2" stroke-linecap="round" fill="none"/>
          <path d="M16 13 L20 8" stroke="#6aa86a" stroke-width="1.2" stroke-linecap="round" fill="none"/>
          <circle cx="10" cy="14" r="1.4" fill="#9dcea0"/>
          <circle cx="22" cy="11" r="1.4" fill="#9dcea0"/>
          <circle cx="12" cy="9" r="1.2" fill="#7cb87c"/>
          <circle cx="20" cy="8" r="1.2" fill="#7cb87c"/>
          <circle cx="16" cy="11" r="1.6" fill="#c4e0c4"/>
        </svg>
        <span>活树</span>
      </a>
      <p class="status" id="statusLine">已生长 · 今天</p>
      <label class="search">
        <span class="sr">搜索</span>
        <input id="searchInput" type="search" placeholder="搜索叶子…" autocomplete="off" />
      </label>
      <div class="top-actions">
        <button type="button" class="btn ghost" id="btnCompile">编译这本书</button>
        <button type="button" class="btn ghost" id="btnSnapshot">导出判断快照</button>
        <button type="button" class="btn solid" id="btnIngest">存入</button>
      </div>
    </header>

    <div class="stage">
      <aside class="pane tree-pane" id="treePane">
        <div class="tree-head">
          <div class="tree-head-row">
            <button type="button" class="all-btn" id="btnAll">全部</button>
            <button type="button" class="tree-add-root" id="btnAddRoot">+ 新枝</button>
            <button type="button" class="icon-btn pane-close" id="treeClose" aria-label="收起知识树">收起</button>
          </div>
          <div class="tree-head-row tree-head-sub" id="skeletonRow" hidden>
            <button type="button" class="tree-add-root" id="btnImplantSkeleton">植入跟进骨架</button>
          </div>
          <div id="rootAddSlot"></div>
        </div>
        <nav class="tree" id="treeNav" aria-label="知识树"></nav>
      </aside>

      <main class="pane center-pane">
        <div class="skeleton-banner" id="skeletonBanner" hidden>
          <p>可植入跟进骨架（终局、拐点、数据层、关键节点等），只补缺失的枝，不会改你已有的目录。</p>
          <div class="skeleton-banner-actions">
            <button type="button" class="btn solid small" id="bannerImplant">植入跟进骨架</button>
            <button type="button" class="btn ghost small" id="bannerDismiss">以后再说</button>
          </div>
        </div>
        <div class="mode-bar">
          <button type="button" class="mode on" data-mode="frontier" id="modeFrontier">前沿</button>
          <button type="button" class="mode" data-mode="stream" id="modeStream">知识流</button>
          <button type="button" class="mode" data-mode="inflection" id="modeInflection">拐点</button>
          <button type="button" class="mode" data-mode="log" id="modeLog">生长日志</button>
        </div>
        <div id="logView" class="view hidden"></div>
        <div id="streamView" class="view hidden"></div>
        <div id="frontierView" class="view"></div>
        <div id="inflectionView" class="view hidden"></div>
      </main>

      <aside class="pane detail-pane" id="detailPane">
        <button type="button" class="icon-btn pane-close detail-close" id="detailClose" aria-label="收起详情">收起</button>
        <div class="detail-empty" id="detailEmpty">
          <p>点开一条，在这里写旁注。</p>
        </div>
        <div class="detail hidden" id="detailBody"></div>
      </aside>
    </div>
  </div>

  <button type="button" class="chat-fab" id="chatFab" aria-label="打开对话">
    <span>对话</span>
  </button>
  <section class="chat-panel" id="chatPanel" hidden>
    <header class="chat-head">
      <strong>问这棵树</strong>
      <span class="chat-scope" id="chatScope">整棵树</span>
      <button type="button" class="icon-btn" id="chatClose" aria-label="收起对话">收起</button>
    </header>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-presets" id="chatPresets"></div>
    <form class="chat-form" id="chatForm">
      <textarea id="chatInput" rows="2" placeholder="这棵树还记得什么…"></textarea>
      <button type="submit" class="btn solid">问</button>
    </form>
    <p class="chat-hint" id="chatHint" hidden>对话要接模型，在活树图标里填 API Key</p>
  </section>

  <div class="drawer-mask" id="drawerMask" hidden></div>

  <dialog class="modal" id="ingestModal">
    <form method="dialog" class="modal-card" id="ingestForm">
      <h2>存入活树</h2>
      <p class="hint">可贴 X 链接、小红书分享口令 / xhslink，或直接贴正文。</p>
      <label>链接
        <input name="url" id="ingestUrl" placeholder="https://x.com/… 或 xhslink.com / 小红书口令" />
      </label>
      <label>作者
        <input name="author" id="ingestAuthor" placeholder="名字或 @handle" />
      </label>
      <label>正文
        <textarea name="text" id="ingestText" rows="6" placeholder="把想留下的字贴在这里"></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="ingestCancel" value="cancel">取消</button>
        <button type="submit" class="btn solid">生长</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal" id="compileModal">
    <div class="modal-card wide">
      <h2>这一章</h2>
      <pre id="compileOut" class="compile-md"></pre>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="compileClose">关闭</button>
        <button type="button" class="btn solid" id="compileCopy">复制</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
